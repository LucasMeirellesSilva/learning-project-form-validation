<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Participantes: Artur Borges Rodrigues, Lucas Kauan Meirelles. -->
<body>
    <form id="formulario">
        <div class="personal-info">
            <h2>Informações Pessoais</h2>
            <div class="input-container">
                <div class="input_usuario" id="nome_usuario">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="...">
                </div>
                <div class="input_usuario" id="sobrenome_usuario">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="...">
                </div>
                <div class="input_usuario" id="dn-usuario">
                    <label for="nascimento">Nascimento</label>
                    <input type="date" id="nascimento" name="nascimento"/>
                </div>
                <div class="input_usuario">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                </div>
                <div class="input_usuario" id="email-usuario">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="email123@example.com">
                </div>
                <div class="input_usuario" id="tel-usuario">
                    <label for="telefone">Telefone</label>
                    <input type="number" id="telefone" name="telefone" placeholder="+55 00 00000-0000">
                </div>
            </div>
        </div>
        <div class="adress-info">
            <h2>Informações de Endereço</h2>
            <div class="input-container">
                <div class="input_usuario" id="pais-usuario">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais" placeholder="Brasil">
                </div>
                <div class="input_usuario" id="cep-usuario">
                    <label for="cep">CEP</label>
                    <input type="number" id="cep" name="cep" placeholder="96180-000">
                </div>
                <div class="input_usuario" id="estado-usuario">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" placeholder="Rio Grande do Sul">
                </div>
                <div class="input_usuario" id="cidade-usuario">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Camaquã">
                </div>
                <div class="input_usuario" id="bairro-usuario">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="...">
                </div>
                <div class="input_usuario" id="rua-usuario">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" placeholder="...">
                </div>
                <div class="input_usuario" id="casa-usuario">
                    <label for="numero">Número</label>
                    <input type="number" id="numero" name="numero" placeholder="...">
                </div>
            </div>
        </div>
        <div class="conhecimentos">
            <h2>Conhecimentos</h2>
            <div class="input-container" id="wrapper-linguagens">
                <div class="linguagem">
                    <label for="css">CSS</label>
                    <input type="checkbox" id="css" name="linguagens" value="CSS">
                    <!-- <img src="/icones/CSS-Logo.png" alt="" width="100px"> -->
                </div>
                <div class="linguagem">
                    <label for="js">JavaScript</label>
                    <input type="checkbox" id="js" name="linguagens" value="JS">
                    <!-- <img src="./icones/JS-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="html">HTML</label>
                    <input type="checkbox" id="html" name="linguagens" value="HTML">
                    <!-- <img src="./icones/HTML-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="php">PHP</label>
                    <input type="checkbox" id="php" name="linguagens" value="PHP">
                    <!-- <img src="./icones/PHP-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="sql">SQL</label>
                    <input type="checkbox" id="sql" name="linguagens" value="SQL">
                    <!-- <img src="./icones/SQL-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="c">C</label>
                    <input type="checkbox" id="c" name="linguagens" value="C">
                    <!-- <img src="./icones/C-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="c++">C++</label>
                    <input type="checkbox" id="c++" name="linguagens" value="C++">
                    <!-- <img src="./icones/Cpp-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="java">Java</label>
                    <input type="checkbox" id="java" name="linguagens" value="Java">
                    <!-- <img src="./icones/Java-Logo.png" alt=""> -->
                </div>
                <div class="linguagem">
                    <label for="pythonLogo">Python</label>
                    <input type="checkbox" id="python" name="linguagens" value="Python">
                    <!-- <img src="./icones/Python-Logo.png" alt="pythonlogo"> -->
                </div>
            </div>
        </div>
        <div class="professional-info">
            <h2>Informações Profissionais</h2>
            <div class="input-container">
                <div class="wrapper">
                    <label for="profissao">Profissão</label>
                    <select id="profissao" name="profissao">
                        <option value="Desenvolvedor">Desenvolvedor</option>
                        <option value="Analista">Analista</option>
                        <option value="Gerente de TI">Gerente de TI</option>
                        <option value="Suporte">Suporte</option>
                    </select>
                </div>
                <label for="wrapper-experiencia">Experiência</label>
                <div class="wrapper" id="wrapper-experiencia">
                    <div class="experiencia">
                        <label for="junior">Júnior</label>
                        <input type="radio" id="junior" name="experiencia" value="Júnior">
                    </div>
                    <div class="experiencia">
                        <label for="pleno">Pleno</label>
                        <input type="radio" id="pleno" name="experiencia" value="Pleno">
                    </div>
                    <div class="experiencia">
                        <label for="senior">Sênior</label>
                        <input type="radio" id="senior" name="experiencia" value="Sênior">
                    </div>
                    <div class="experiencia">
                        <label for="master">Master</label>
                        <input type="radio" id="master" name="experiencia" value="Master">
                    </div>
                </div>
            </div>
        </div>
        <div class="info-adicional">
            <label for="descricao">
                <h2>Informações Adicionais</h2>
            </label>
            <textarea name="descricao" id="descricao" placeholder="Digite aqui habilidades adicionais que você possuai" rows="8"></textarea>
        </div>
        <div class="btn-wrapper">
            <button type="reset" class="form-btn" id="del-btn">Apagar</button>
            <button type="submit" class="form-btn" id="submit-btn">Enviar</button>
        </div>
    </form>
    <script src="main.js"></script>
</body>
</html>

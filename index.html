<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Participantes: Artur Borges Rodrigues, Lucas Kauan Meirelles. -->
<body>
    <form id="formulario">
        <div class="personal-info">
            <h2>Informações Pessoais</h2>
            <div class="input-container">
                <div class="input-usuario" id="nome-usuario">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="...">
                    <span class="erro" id="nome-erro"></span>
                </div>
                <div class="input-usuario" id="sobrenome-usuario">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="...">
                    <span class="erro" id="sobrenome-erro"></span>
                </div>
                <div class="input-usuario" id="dn-usuario">
                    <label for="nascimento">Nascimento</label>
                    <input type="date" id="nascimento" name="nascimento"/>
                    <span class="erro" id="data-erro"></span>
                </div>
                <div class="input-usuario">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                    <span class="erro" id="cpf-erro"></span>
                </div>
                <div class="input-usuario" id="email-usuario">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="email123@example.com">
                    <span class="erro" id="email-erro"></span>
                </div>
                <div class="input-usuario" id="tel-usuario">
                    <label for="telefone">Telefone</label>
                    <input type="number" id="telefone" name="telefone" placeholder="00 00000-0000">
                    <span class="erro" id="fone-erro"></span>
                </div>
            </div>
        </div>
        <div class="adress-info">
            <h2>Informações de Endereço</h2>
            <div class="input-container">
                <div class="input-usuario" id="pais-usuario">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais" placeholder="Brasil">
                </div>
                <div class="input-usuario" id="cep-usuario">
                    <label for="cep">CEP</label>
                    <input type="number" id="cep" name="cep" placeholder="96180-000">
                </div>
                <div class="input-usuario" id="estado-usuario">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" placeholder="Rio Grande do Sul">
                </div>
                <div class="input-usuario" id="cidade-usuario">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Camaquã">
                </div>
                <div class="input-usuario" id="bairro-usuario">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="...">
                </div>
                <div class="input-usuario" id="rua-usuario">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" placeholder="...">
                </div>
                <div class="input-usuario" id="casa-usuario">
                    <label for="numero">Número</label>
                    <input type="number" id="numero" name="numero" placeholder="...">
                </div>
            </div>
        </div>






        <div class="conhecimentos">
            <h2>Conhecimentos</h2>


            <div class="checkbox-container" id="wrapper-linguagens">
                <div class="linguagem">
                    <input type="checkbox" id="css" name="linguagens" class="box" value="CSS">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="/icones/CSS-Logo.png" alt="logo CSS" draggable="false">
                        </div>
                        <p>CSS</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="js" name="linguagens" class="box" value="JS">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/JS-Logo.png" alt="Logo JS" draggable="false">
                        </div>
                        <p>JavaScript</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="html" name="linguagens" class="box" value="HTML">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/HTML-Logo.png" alt="" draggable="false">
                        </div>
                        <p>HTML</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="php" name="linguagens" class="box" value="PHP">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/PHP-Logo.png" alt="" draggable="false">
                        </div>
                        <p>PHP</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="sql" name="linguagens" class="box" value="SQL">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/SQL-Logo.png" alt="" draggable="false">
                        </div>
                        <p>SQL</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="c" name="linguagens" class="box" value="C">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/C-Logo.png" alt="" draggable="false">
                        </div>
                        <p>C</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="c++" name="linguagens" class="box" value="C++">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/Cpp-Logo.png" alt="" draggable="false">
                        </div>
                        <p>C++</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="java" name="linguagens" class="box" value="Java">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/Java-Logo.png" alt="" draggable="false">
                        </div>
                        <p>Java</p>
                    </div>
                </div>
                <div class="linguagem">
                    <input type="checkbox" id="python" name="linguagens" class="box" value="Python">
                    <div class="language-content">
                        <div class="lang-img">
                            <img src="./icones/Python-Logo.png" alt="pythonlogo" draggable="false">
                        </div>
                        <p>Python</p>
                    </div>
                </div>
            </div>
        </div>

        <h2>Informações Profissionais</h2>
        <div class="professional-info">
            <label for="profissao">Profissão</label>
            <div class="wrapper">
                <select id="profissao" name="profissao">
                    <option value="Desenvolvedor">Desenvolvedor</option>
                    <option value="Analista">Analista</option>
                    <option value="Gerente de TI">Gerente de TI</option>
                    <option value="Suporte">Suporte</option>
                </select>
            </div>
            <label for="wrapper-experiencia">Experiência</label>
            <div class="wrapper-radio" id="wrapper-experiencia">
                <div class="experiencia">
                    <label for="junior">Júnior</label>
                    <input type="radio" id="junior" name="experiencia" value="Júnior">
                </div>
                <div class="experiencia">
                    <label for="pleno">Pleno</label>
                    <input type="radio" id="pleno" name="experiencia" value="Pleno">
                </div>
                <div class="experiencia">
                    <label for="senior">Sênior</label>
                    <input type="radio" id="senior" name="experiencia" value="Sênior">
                </div>
                <div class="experiencia">
                    <label for="master">Master</label>
                    <input type="radio" id="master" name="experiencia" value="Master">
                </div>
            </div>
        </div>
        <div class="info-adicional">
            <label for="descricao">
                <h2>Informações Adicionais</h2>
            </label>
            <textarea name="descricao" id="descricao" placeholder="Insira aqui Informações adicionais que possam ser úteis" rows="8"></textarea>
        </div>
        <div class="btn-wrapper">
            <button type="reset" class="form-btn" id="del-btn">Apagar</button>
            <button type="submit" class="form-btn" id="submit-btn">Enviar</button>
        </div>
    </form>
    <script src="main.js"></script>
    <script src="validation.js"></script>
</body>
</html>

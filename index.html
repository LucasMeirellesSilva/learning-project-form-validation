<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Participantes: Artur Borges Rodrigues, Lucas Kauan Meirelles. -->
<body>
    <form>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
        
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome" required>
        
        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
        
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="email123@example.com" required>
        
        <label for="telefone">Telefone</label>
        <input type="number" id="telefone" name="telefone" placeholder="+55 00 98765-4321" required>
        
        <label for="pais">País</label>
        <input type="text" id="pais" name="pais" required>
        
        <label for="cep">CEP</label>
        <input type="number" id="cep" name="cep" placeholder="96180-000" required>
        
        <label for="estado">Estado</label>
        <input type="text" id="estado" name="estado" required>
        
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>
        
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro" required>
        
        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua" required>
        
        <label for="numero">Número</label>
        <input type="number" id="numero" name="numero">
        
        <label for="profissao">Profissão</label>
        <select id="profissao" name="profissao">
            <option value="Desenvolvedor">Desenvolvedor</option>
            <option value="Analista">Analista</option>
            <option value="Gerente de TI">Gerente de TI</option>
            <option value="Suporte">Suporte</option>
        </select>
        
        <label for="wrapper-linguagens">Linguagens</label>
        <div class="wrapper" id="wrapper-linguagens">
            <div class="linguagem">
                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="linguagens" value="CSS">
            </div>
            <div class="linguagem">
                <label for="js">JavaScript</label>
                <input type="checkbox" id="js" name="linguagens" value="JS">
            </div>
            <div class="linguagem">
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="linguagens" value="HTML">
            </div>
            <div class="linguagem">
                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="linguagens" value="PHP">
            </div>
            <div class="linguagem">
                <label for="sql">SQL</label>
                <input type="checkbox" id="sql" name="linguagens" value="SQL">
            </div>
            <div class="linguagem">
                <label for="c">C</label>
                <input type="checkbox" id="c" name="linguagens" value="C">
            </div>
            <div class="linguagem">
                <label for="c++">C++</label>
                <input type="checkbox" id="c++" name="linguagens" value="C++">
            </div>
            <div class="linguagem">
                <label for="java">Java</label>
                <input type="checkbox" id="java" name="linguagens" value="Java">
            </div>
            <div class="linguagem">
                <label for="python">Python</label>
                <input type="checkbox" id="python" name="linguagens" value="Python">
            </div>
        </div>
        
        <label for="wrapper-experiencia">Experiência</label>
        <div class="wrapper" id="wrapper-experiencia">
            <div class="experiencia">
                <label for="junior">Júnior</label>
                <input type="radio" id="junior" name="experiencia" value="Júnior">
            </div>
            <div class="experiencia">
                <label for="pleno">Pleno</label>
                <input type="radio" id="pleno" name="experiencia" value="Pleno">
            </div>
            <div class="experiencia">
                <label for="senior">Sênior</label>
                <input type="radio" id="senior" name="experiencia" value="Sênior">
            </div>
            <div class="experiencia">
                <label for="master">Master</label>
                <input type="radio" id="master" name="experiencia" value="Master">
            </div>
        </div>
        <textarea name="descricao" id="descricao" placeholder="Informação adicional"></textarea>
        <div class="bttn-wrapper">
            <button type="reset">Apagar</button>
            <button type="submit">Enviar</button>
        </div>
    </form>
</body>
</html>
